# Host-side unit tests only: no sandboxes, no secrets (CLAUDE.md §5.2, "CI").
name: test

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make test PYTHON=python
      - run: make site-check
